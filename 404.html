<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ÉTERNITÉ GROUP</title>
  <link rel="stylesheet" href="general.css">
  <link rel="shortcut icon" href="./logo/FAV_D.ico" type="image/x-icon">
  <style>
    .p404 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: #06070a;
      padding: 2rem 1.5rem 5rem;
    }

    /* ── CAPA 0: canvas polvo ── */
    #dust {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── CAPA 1: engranajes al fondo ── */
    .gears-bg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      animation: gearsIn 1.4s 0.2s ease forwards;
    }

    .gears-bg svg {
      width: min(700px, 110vw);
      height: min(700px, 110vw);
      opacity: 0.22;
    }

    @keyframes gearsIn {
      to { opacity: 1; }
    }

    /* engranajes giratorios */
    .ga { transform-origin: 350px 350px; animation: sa 28s linear infinite; }
    .gb { transform-origin: 530px 250px; animation: sb 18s linear infinite; }
    .gc { transform-origin: 170px 270px; animation: sc 22s linear infinite; }
    .gd { transform-origin: 560px 480px; animation: sd 14s linear infinite; }
    .ge { transform-origin: 160px 500px; animation: se 20s linear infinite; }

    @keyframes sa { to { transform: rotate(360deg); } }
    @keyframes sb { to { transform: rotate(-360deg); } }
    @keyframes sc { to { transform: rotate(360deg); } }
    @keyframes sd { to { transform: rotate(-360deg); } }
    @keyframes se { to { transform: rotate(360deg); } }

    /* ── CAPA 2: gradiente encima de engranajes ── */
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 60% at 50% 50%, transparent 20%, rgba(6,7,10,0.75) 70%, #06070a 100%),
        radial-gradient(ellipse 40% 35% at 50% 50%, rgba(91,155,213,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 2;
    }

    /* ── CAPA 3: contenido ── */
    .scene {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* eyebrow */
    .eyebrow-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s ease forwards;
    }
    .ey-line {
      width: 24px; height: 1px;
      background: rgba(91,155,213,0.45);
    }
    .ey-text {
      font-size: 0.56rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: #5b9bd5;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
    }

    /* ── 404 GRANDE ── */
    .num404 {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 0.05em;
      line-height: 1;
      opacity: 0;
      animation: fadeUp 1s 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .n-four {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 300;
      color: #eef2f8;
      letter-spacing: -0.02em;
      line-height: 0.88;
    }

    .n-zero {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 300;
      line-height: 0.88;
      letter-spacing: -0.02em;
      /* efecto: contorno con brillo interior */
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(91,155,213,0.7);
      text-shadow: none;
      position: relative;
    }

    /* halo difuso detrás del cero */
    .n-zero::before {
      content: '0';
      position: absolute;
      inset: 0;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
      color: transparent;
      -webkit-text-stroke: 0px transparent;
      text-shadow:
        0 0 40px rgba(91,155,213,0.18),
        0 0 80px rgba(91,155,213,0.08);
      z-index: -1;
    }

    /* línea dorada bajo el 404 */
    .num-rule {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,90,0.6), transparent);
      margin: 1.4rem auto 0;
      animation: ruleExpand 0.9s 1.5s ease forwards;
    }
    @keyframes ruleExpand { to { width: 220px; } }

    /* ── SUBTÍTULO ── */
    .sub-block {
      margin-top: 2.2rem;
      opacity: 0;
      animation: fadeUp 0.9s 1.1s ease forwards;
    }

    .sub-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.25rem, 3.5vw, 1.9rem);
      font-weight: 300;
      color: #dde5f0;
      letter-spacing: 0.05em;
      margin-bottom: 0.7rem;
      line-height: 1.3;
    }

    .sub-body {
      font-size: 0.8rem;
      line-height: 1.95;
      color: #5a6b80;
      max-width: 380px;
      margin: 0 auto;
      letter-spacing: 0.02em;
    }

    /* ── DIVISOR ORNAMENTAL ── */
    .ornament {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 2rem 0;
      opacity: 0;
      animation: fadeUp 0.9s 1.3s ease forwards;
    }
    .orn-line { height: 1px; background: rgba(91,155,213,0.18); }
    .orn-long { width: 60px; }
    .orn-short { width: 12px; }
    .orn-diamond {
      width: 5px; height: 5px;
      border: 1px solid rgba(201,168,90,0.5);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* ── BOTONES ── */
    .btns {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0;
      animation: fadeUp 0.9s 1.4s ease forwards;
    }

    .btn-p {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.85rem 2rem;
      border: 1px solid rgba(91,155,213,0.55);
      background: rgba(91,155,213,0.06);
      color: #7ab3d8;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .btn-p:hover {
      background: rgba(91,155,213,0.14);
      border-color: rgba(91,155,213,0.85);
      color: #a8cfe8;
    }
    .btn-p svg {
      width: 12px; height: 12px;
      stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.25s;
    }
    .btn-p:hover svg { transform: translateX(3px); }

    .btn-s {
      display: inline-flex;
      align-items: center;
      padding: 0.85rem 2rem;
      border: 1px solid rgba(238,242,248,0.1);
      background: transparent;
      color: rgba(148,163,184,0.55);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.63rem;
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-decoration: none;
      transition: border-color 0.3s, color 0.3s;
    }
    .btn-s:hover {
      border-color: rgba(238,242,248,0.22);
      color: rgba(238,242,248,0.75);
    }

    /* ── BANDA INFERIOR ── */
    .strip {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      overflow: hidden;
      z-index: 3;
      border-top: 1px solid rgba(91,155,213,0.06);
    }
    .strip-track {
      display: flex;
      gap: 4rem;
      white-space: nowrap;
      animation: stripScroll 32s linear infinite;
      font-size: 0.5rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(91,155,213,0.2);
      font-family: 'Montserrat', sans-serif;
      line-height: 32px;
    }
    @keyframes stripScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .btns { flex-direction: column; align-items: center; }
      .btn-p, .btn-s { width: 100%; max-width: 240px; justify-content: center; }
      .orn-long { width: 36px; }
    }
  </style>
</head>

<script>
/* PARTÍCULAS */
(function(){
  const c = document.getElementById('dust');
  const ctx = c.getContext('2d');
  let W, H, pts = [];
  const N = 50;
  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  function mk(){
    return {
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.1+0.3,
      vx: (Math.random()-.5)*.12,
      vy: -(Math.random()*.18+.04),
      a: Math.random()*.2+.03,
      t: Math.random(), gold: Math.random()>.65
    };
  }
  resize();
  pts = Array.from({length:N}, mk);
  window.addEventListener('resize', resize);
  (function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.t += .0035;
      if(p.t>1){ Object.assign(p, mk(), {x:Math.random()*W, y:H+4, t:0}); }
      const f = p.t<.12 ? p.t/.12 : p.t>.88 ? (1-p.t)/.12 : 1;
      ctx.beginPath();
      ctx.arc(p.x+p.vx*p.t*280, p.y+p.vy*p.t*280, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.gold
        ? `rgba(201,168,90,${p.a*f*.55})`
        : `rgba(91,155,213,${p.a*f})`;
      ctx.fill();
    });
    requestAnimationFrame(loop);
  })();
})();

/* TICKER */
(function(){
  const w = ['Éternité Group','Own Your Time','Error 404','Relojería de Alta Gama','Precisión y Distinción','Tiempo Detenido'];
  const t = (w.join(' · ') + ' · ').repeat(10);
  document.getElementById('stripTrack').textContent = t;
})();

/* PARALAJE */
(function(){
  const scene = document.querySelector('.scene');
  const gears = document.querySelector('.gears-bg');
  window.addEventListener('mousemove', e=>{
    const dx = (e.clientX/innerWidth -.5);
    const dy = (e.clientY/innerHeight-.5);
    scene.style.transform = `translate(${dx*10}px,${dy*7}px)`;
    gears.style.transform = `translate(${dx*-18}px,${dy*-12}px)`;
  });
})();
</script>
