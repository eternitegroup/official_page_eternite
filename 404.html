<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — ÉTERNITÉ GROUP</title>
  <link rel="stylesheet" href="general.css">
  <link rel="shortcut icon" href="./logo/FAV_D.ico" type="image/x-icon">
  <style>
    /* ── 404 PAGE ── */
    .page-404 {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 2rem;
    }

    .page-404::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 55%, rgba(91,155,213,0.09) 0%, transparent 68%),
        radial-gradient(ellipse 80% 80% at 50% 100%, rgba(30,80,140,0.05) 0%, transparent 60%);
      pointer-events: none;
    }

    .page-404::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.5;
      pointer-events: none;
    }

    /* Anillos decorativos */
    .deco-rings {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .deco-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(91,155,213,0.07);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .deco-ring:nth-child(1) { width: 340px; height: 340px; }
    .deco-ring:nth-child(2) { width: 560px; height: 560px; opacity: 0.6; }
    .deco-ring:nth-child(3) { width: 780px; height: 780px; opacity: 0.35; }
    .deco-ring:nth-child(4) { width: 1000px; height: 1000px; opacity: 0.18; }

    .deco-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .deco-cross span {
      display: block;
      position: absolute;
      background: var(--gold);
      opacity: 0.06;
    }

    .deco-cross span:first-child {
      width: 1px; height: 1000px;
      top: -500px; left: 0;
    }

    .deco-cross span:last-child {
      width: 1000px; height: 1px;
      left: -500px; top: 0;
    }

    /* ── CONTENIDO ── */
    .content-404 {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeUp 1s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .label-404 {
      font-size: 0.62rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      font-family: var(--font-body);
      font-weight: 500;
      margin-bottom: 2rem;
      opacity: 0.8;
      animation: fadeUp 1s 0.1s cubic-bezier(0.4,0,0.2,1) both;
    }

    /* ── FILA 4·O·4 ── */
    .hero-404 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(0.5rem, 2vw, 3rem);
      animation: fadeUp 1s 0.18s cubic-bezier(0.4,0,0.2,1) both;
    }

    /* Los dos "4" blancos */
    .digit-4 {
      font-family: var(--font-display);
      font-size: clamp(6rem, 18vw, 17rem);
      font-weight: 300;
      color: var(--white);
      letter-spacing: -0.02em;
      user-select: none;
      line-height: 0.85;
      display: flex;
      align-items: center;
    }

    /* Reloj */
    .clock-zero {
      width: clamp(5rem, 15.3vw, 14.45rem);
      height: clamp(5rem, 15.3vw, 14.45rem);
      flex-shrink: 0;
      margin-top: 1.2rem;
      align-self: center;
    }

    @media (max-width: 768px) {
      .digit-4 {
        font-size: 22vw;
        line-height: 1;
      }
      .clock-zero {
        width: 22vw;
        height: 22vw;
        margin-top: 1.5vw;
      }
      .hero-404 {
        gap: 3vw;
      }
    }

    .clock-zero svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Manecillas animadas */
    .hand-hour { transform-origin: 50px 50px; animation: rotateHour 43200s linear infinite; }
    .hand-min  { transform-origin: 50px 50px; animation: rotateMin  3600s  linear infinite; }
    .hand-sec  { transform-origin: 50px 50px; animation: rotateSec  60s steps(60,end) infinite; }

    @keyframes rotateHour { to { transform: rotate(360deg); } }
    @keyframes rotateMin  { to { transform: rotate(360deg); } }
    @keyframes rotateSec  { to { transform: rotate(360deg); } }

    /* ── RESTO ── */
    .divider-404 {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 2.5rem auto;
      animation: fadeUp 1s 0.3s cubic-bezier(0.4,0,0.2,1) both;
    }

    .title-404 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 300;
      color: var(--white);
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      animation: fadeUp 1s 0.36s cubic-bezier(0.4,0,0.2,1) both;
    }

    .subtitle-404 {
      font-size: 0.86rem;
      line-height: 1.9;
      color: var(--white-dim);
      max-width: 420px;
      margin: 0 auto;
      animation: fadeUp 1s 0.43s cubic-bezier(0.4,0,0.2,1) both;
    }

    .actions-404 {
      display: flex;
      gap: 1rem;
      margin-top: 3rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 1s 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }

    .btn-404-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.9rem 2.2rem;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: color 0.35s ease;
      text-decoration: none;
    }

    .btn-404-primary::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gold);
      transform: translateX(-101%);
      transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
    }

    .btn-404-primary:hover { color: var(--black); }
    .btn-404-primary:hover::before { transform: translateX(0); }

    .btn-404-primary span,
    .btn-404-primary svg { position: relative; z-index: 1; }

    .btn-404-primary svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.25s ease;
    }

    .btn-404-primary:hover svg { transform: translateX(3px); }

    .btn-404-secondary {
      display: inline-flex;
      align-items: center;
      padding: 0.9rem 2.2rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--white-dim);
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.35s ease, color 0.35s ease;
      text-decoration: none;
    }

    .btn-404-secondary:hover { color: var(--white); }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .deco-ring:nth-child(3),
      .deco-ring:nth-child(4) { display: none; }
      .actions-404 { flex-direction: column; align-items: center; }
      .btn-404-primary,
      .btn-404-secondary { width: 100%; justify-content: center; max-width: 280px; }
    }
  </style>
</head>
<body>

<header>
  <div class="menu">
    <div class="menu-logo">
      <a href="index.html"><img src="./logo/FAV_D.png" alt="Éternité Group Logo"></a>
    </div>
    <nav class="menu-nav">
      <button onclick="irA('index.html')">Inicio</button>
      <button onclick="irA('relojes.html')">Relojes</button>
      <button onclick="irA('servicios.html')">Servicios</button>
      <button onclick="irA('contacto.html')">Contacto</button>
    </nav>
  </div>
</header>

<main>
  <section class="page-404">

    <div class="deco-rings" aria-hidden="true">
      <div class="deco-ring"></div>
      <div class="deco-ring"></div>
      <div class="deco-ring"></div>
      <div class="deco-ring"></div>
    </div>
    <div class="deco-cross" aria-hidden="true">
      <span></span><span></span>
    </div>

    <div class="content-404">

      <p class="label-404">Error · Página no encontrada</p>

      <!-- 4 · reloj · 4 -->
      <div class="hero-404" aria-label="404">

        <span class="digit-4" aria-hidden="true">4</span>

        <!-- Reloj analógico como "0" -->
        <div class="clock-zero" aria-hidden="true">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Bisel exterior -->
            <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(238,242,248,0.12)" stroke-width="1"/>
            <!-- Cara del reloj -->
            <circle cx="50" cy="50" r="44" fill="rgba(8,9,12,0.7)" stroke="rgba(238,242,248,0.9)" stroke-width="1.5"/>
            <!-- Anillo interior decorativo -->
            <circle cx="50" cy="50" r="39" fill="none" stroke="rgba(91,155,213,0.2)" stroke-width="0.5"/>

            <!-- Índices de hora — mayores (12, 3, 6, 9) -->
            <line x1="50" y1="8"  x2="50" y2="17" stroke="rgba(238,242,248,0.95)" stroke-width="2.2" stroke-linecap="round" transform="rotate(0   50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="17" stroke="rgba(238,242,248,0.95)" stroke-width="2.2" stroke-linecap="round" transform="rotate(90  50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="17" stroke="rgba(238,242,248,0.95)" stroke-width="2.2" stroke-linecap="round" transform="rotate(180 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="17" stroke="rgba(238,242,248,0.95)" stroke-width="2.2" stroke-linecap="round" transform="rotate(270 50 50)"/>

            <!-- Índices menores (resto de horas) -->
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(30  50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(60  50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(120 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(150 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(210 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(240 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(300 50 50)"/>
            <line x1="50" y1="8"  x2="50" y2="14" stroke="rgba(238,242,248,0.35)" stroke-width="1"   stroke-linecap="round" transform="rotate(330 50 50)"/>

            <!-- Manecilla de horas (~10:10) -->
            <g class="hand-hour" style="transform: rotate(300deg); transform-origin: 50px 50px;">
              <line x1="50" y1="50" x2="50" y2="26" stroke="rgba(238,242,248,0.95)" stroke-width="2.5" stroke-linecap="round"/>
            </g>

            <!-- Manecilla de minutos (~10:10) -->
            <g class="hand-min" style="transform: rotate(60deg); transform-origin: 50px 50px;">
              <line x1="50" y1="50" x2="50" y2="18" stroke="rgba(238,242,248,0.95)" stroke-width="1.8" stroke-linecap="round"/>
            </g>

            <!-- Segundero -->
            <g class="hand-sec" style="transform: rotate(0deg); transform-origin: 50px 50px;">
              <!-- Contrapeso -->
              <line x1="50" y1="50" x2="50" y2="60" stroke="rgba(91,155,213,1)" stroke-width="1" stroke-linecap="round"/>
              <!-- Aguja -->
              <line x1="50" y1="50" x2="50" y2="15" stroke="rgba(91,155,213,1)" stroke-width="0.9" stroke-linecap="round"/>
            </g>

            <!-- Punto central -->
            <circle cx="50" cy="50" r="3"   fill="rgba(91,155,213,1)"/>
            <circle cx="50" cy="50" r="1.4" fill="rgba(8,9,12,1)"/>
          </svg>
        </div>

        <span class="digit-4" aria-hidden="true">4</span>

      </div>

      <div class="divider-404"></div>

      <h1 class="title-404">El tiempo se ha detenido aquí</h1>

      <p class="subtitle-404">
        La página que buscas no existe o ha sido movida. Cada segundo cuenta — no lo pierdas en una dirección equivocada.
      </p>

      <div class="actions-404">
        <a href="index.html" class="btn-404-primary" onclick="event.preventDefault(); irA('index.html')">
          <span>Volver al inicio</span>
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <a href="relojes.html" class="btn-404-secondary" onclick="event.preventDefault(); irA('relojes.html')">
          <span>Ver relojes</span>
        </a>
      </div>

    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
